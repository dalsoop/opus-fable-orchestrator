<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <rect width="1600" height="720" fill="#FFFFFF"/>
  <text x="800" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">Models at the gate</text>
  <text x="800" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#6B7280">Session agent stays. Read-only consult is a child. Pairing below is optional.</text>

  <rect x="80" y="130" width="420" height="200" rx="16" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
  <text x="290" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Session model</text>
  <text x="290" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#4B5563">Whoever is already running</text>
  <text x="290" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#4B5563">Grok, Codex, Claude, GPT, ...</text>
  <text x="290" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#2A9B8F">Optional pick: Opus 4.6</text>
  <text x="290" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#E07A2F">Not Opus 5.0</text>

  <rect x="590" y="155" width="420" height="150" rx="16" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
  <text x="800" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Gate</text>
  <text x="800" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#4B5563">Before a score | 10+ files | merge/ship</text>
  <text x="800" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#4B5563">or 2+ overconfidence signals</text>

  <rect x="1100" y="130" width="420" height="200" rx="16" fill="#fff" stroke="#E07A2F" stroke-width="3"/>
  <text x="1310" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Consult model</text>
  <text x="1310" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#4B5563">Read-only child | no files | no tools</text>
  <text x="1310" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#4B5563">Does not replace the session agent</text>
  <text x="1310" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#E07A2F">Optional pick: Fable 5</text>
  <text x="1310" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6B7280">Short reply | high cost per token</text>

  <rect x="480" y="420" width="640" height="220" rx="16" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
  <text x="800" y="465" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Digest</text>
  <text x="800" y="502" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#4B5563">accept | reject | defer + reason</text>
  <text x="800" y="536" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#4B5563">Report min(code score, reachable ceiling)</text>
  <text x="800" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#6B7280">Opus 4.6 = executor value  |  Fable 5 = judgment, not a rewrite loop</text>
  <text x="800" y="608" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#6B7280">Skip the pair if a session model is already running</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A9B8F"/>
    </marker>
  </defs>
  <g fill="none" stroke="#2A9B8F" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 500 230 H 582"/>
    <path d="M 1010 230 H 1092"/>
    <path d="M 800 305 V 412"/>
  </g>
</svg>
