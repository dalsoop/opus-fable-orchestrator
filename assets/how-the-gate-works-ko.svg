<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <rect width="1600" height="720" fill="#FFFFFF"/>
  <text x="800" y="52" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">게이트의 모델</text>
  <text x="800" y="84" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#6B7280">세션 에이전트는 유지. 자문은 읽기 전용 하위 에이전트. 아래 짝은 옵션.</text>

  <rect x="80" y="130" width="420" height="200" rx="16" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
  <text x="290" y="175" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">세션 모델</text>
  <text x="290" y="208" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#4B5563">이미 돌고 있는 모델</text>
  <text x="290" y="232" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#4B5563">Grok · Codex · Claude · GPT · …</text>
  <text x="290" y="272" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="700" fill="#2A9B8F">옵션: Opus 4.6</text>
  <text x="290" y="296" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#E07A2F">Opus 5.0 아님</text>

  <rect x="590" y="155" width="420" height="150" rx="16" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
  <text x="800" y="205" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">게이트</text>
  <text x="800" y="238" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#4B5563">점수 보고 · 10+ 파일 · 머지/배포 전</text>
  <text x="800" y="268" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#4B5563">또는 과신 신호 2개 이상</text>

  <rect x="1100" y="130" width="420" height="200" rx="16" fill="#fff" stroke="#E07A2F" stroke-width="3"/>
  <text x="1310" y="175" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">자문 모델</text>
  <text x="1310" y="208" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#4B5563">읽기 전용 · 파일 없음 · 도구 없음</text>
  <text x="1310" y="232" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#4B5563">세션 에이전트를 대체하지 않음</text>
  <text x="1310" y="272" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" font-weight="700" fill="#E07A2F">옵션: Fable 5</text>
  <text x="1310" y="296" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#6B7280">짧은 답 · 토큰당 비용 높음</text>

  <rect x="480" y="420" width="640" height="220" rx="16" fill="#fff" stroke="#1B2A4A" stroke-width="2"/>
  <text x="800" y="465" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">소화</text>
  <text x="800" y="502" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#4B5563">수락 · 거절 · 보류 + 이유</text>
  <text x="800" y="536" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#4B5563">보고는 min(코드 점수, 도달 가능 상한)</text>
  <text x="800" y="580" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#6B7280">Opus 4.6 = 실행 가성비  ·  Fable 5 = 판단, 재작성 루프 아님</text>
  <text x="800" y="608" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#6B7280">이미 세션 모델이 있으면 이 짝을 강제하지 않음</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A9B8F"/>
    </marker>
  </defs>
  <g fill="none" stroke="#2A9B8F" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 500 230 H 582"/>
    <path d="M 1010 230 H 1092"/>
    <path d="M 800 305 V 412"/>
  </g>
</svg>
